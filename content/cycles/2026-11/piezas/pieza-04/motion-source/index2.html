<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:300;src:url(assets/montserrat-latin-300-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(assets/montserrat-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(assets/montserrat-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:900;src:url(assets/montserrat-latin-900-normal.woff2)}
html,body{margin:0;background:#F8F8F6}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F8F8F6;font-family:M,sans-serif;color:#383838}
.e{position:absolute;left:540px;top:960px;white-space:nowrap;display:none;will-change:transform}
.t{font-weight:800;line-height:1.05;text-align:center}
.hl{position:relative;display:inline-block;padding:0 22px}
.hl .bg{position:absolute;left:0;top:6%;width:100%;height:88%;background:#A7FF6B;transform-origin:left center;z-index:0}
.hl span{position:relative;z-index:1}
</style></head><body><div id="stage"></div>
<script>
const LIME='#A7FF6B',INK='#383838',GREEN='#39713E',PAPER='#F8F8F6';
const st=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eb=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const tracks=[];
function mk(html,css){const d=document.createElement('div');d.className='e';d.innerHTML=html;if(css)d.style.cssText+=css;st.appendChild(d);return d}
function put(d,x=0,y=0,o={}){const s=o.s??1,r=o.r??0;d.style.opacity=o.o??1;d.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`}
function track(d,a,b,fn){tracks.push({d,a,b,fn})}
// fade window helper: in/out opacity
const win=(lt,dur,i=.2,o=.25)=>Math.min(clamp(lt/i),clamp((dur-lt)/o));
function T(txt,size,color=INK,w=800){return `<div class="t" style="font-size:${size}px;color:${color};font-weight:${w}">${txt}</div>`}
function HL(txt,size){return `<div class="t"><span class="hl" style="font-size:${size}px"><i class="bg"></i><span>${txt}</span></span></div>`}
function setHL(d,p){const b=d.querySelector('.bg');if(b)b.style.transform=`scaleX(${clamp(p)})`}
// ---------- icons
const clockSVG=`<svg width="560" height="560" viewBox="0 0 400 400"><circle cx="200" cy="200" r="182" fill="#fff" stroke="${INK}" stroke-width="14"/>${[...Array(12)].map((_,i)=>`<line x1="200" y1="36" x2="200" y2="${i%3?50:62}" stroke="${INK}" stroke-width="${i%3?6:10}" stroke-linecap="round" transform="rotate(${i*30} 200 200)"/>`).join('')}<line id="hh" x1="200" y1="200" x2="200" y2="118" stroke="${INK}" stroke-width="16" stroke-linecap="round"/><line id="mh" x1="200" y1="200" x2="200" y2="70" stroke="${GREEN}" stroke-width="10" stroke-linecap="round"/><circle cx="200" cy="200" r="14" fill="${GREEN}"/></svg>`;
const heart=`<svg width="120" height="120" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
const cup=`<svg width="120" height="120" viewBox="0 0 24 24"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z M16 10h2a2.5 2.5 0 0 1 0 5h-2 M8 3v3 M12 3v3" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const user=`<svg width="120" height="120" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="${INK}" stroke-width="1.8"/><path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const calSVG=`<svg width="420" height="420" viewBox="0 0 100 100"><rect x="10" y="18" width="80" height="72" rx="12" fill="#fff" stroke="${INK}" stroke-width="4"/><rect x="10" y="18" width="80" height="22" rx="12" fill="${LIME}" stroke="${INK}" stroke-width="4"/><line x1="30" y1="8" x2="30" y2="26" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><line x1="70" y1="8" x2="70" y2="26" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><path id="ck" d="M30 66 l14 14 l27 -28" fill="none" stroke="${GREEN}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="80" stroke-dashoffset="80"/></svg>`;

// ---------- character
const SKIN='#E9B48A',HAIR='#2B2B2B';
function dani(mood){
 const eyes = mood==='relax' ? `<path d="M110 135 q15 -14 30 0 M160 135 q15 -14 30 0" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`
  : mood==='happy' ? `<circle cx="125" cy="135" r="9" fill="${INK}"/><circle cx="175" cy="135" r="9" fill="${INK}"/>`
  : `<circle cx="125" cy="135" r="12" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="175" cy="135" r="12" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="125" cy="138" r="5" fill="${INK}"/><circle cx="175" cy="138" r="5" fill="${INK}"/>`;
 const brows = mood==='stress' ? `<path d="M105 108 l35 12 M195 108 l-35 12" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`
  : mood==='sad' ? `<path d="M105 120 l35 -10 M195 120 l-35 -10" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>` : '';
 const mouth = mood==='happy' ? `<path d="M118 172 q32 30 64 0" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`
  : mood==='relax' ? `<path d="M112 168 q38 46 76 0 z" fill="#fff" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>`
  : `<path d="M122 186 q28 -22 56 0" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`;
 const sweat = mood==='stress' ? `<path d="M232 105 q-14 22 0 32 q14 -10 0 -32z" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>` : '';
 return `<svg width="560" height="670" viewBox="0 0 300 360"><rect x="55" y="225" width="190" height="125" rx="62" fill="${GREEN}" stroke="${INK}" stroke-width="8"/><rect x="95" y="262" width="110" height="82" rx="20" fill="${LIME}" stroke="${INK}" stroke-width="8"/><rect x="128" y="190" width="44" height="48" fill="${SKIN}" stroke="${INK}" stroke-width="8"/><circle cx="150" cy="130" r="72" fill="${SKIN}" stroke="${INK}" stroke-width="8"/><path d="M78 125 a72 72 0 0 1 144 0 q-36 -38 -72 -30 q-36 -8 -72 30z" fill="${HAIR}"/>${eyes}${brows}${mouth}${sweat}</svg>`}
function setMood(d,m){if(d.dataset.m!==m){d.dataset.m=m;d.innerHTML=dani(m)}}
// ---------- persistent
const DUR=39;
const bar=mk('<div style="width:1080px;height:10px;background:#A7FF6B;transform-origin:left"></div>','left:0;top:0;transform:none;display:block');
const handle=mk(T('@iguana.ec',30,GREEN,500),'top:1850px;display:block');
const bob=(lt,a=10,f=3)=>Math.sin(lt*f)*a;
// ---- A 0-4.4 sabias que
const a0=mk(HL('¿Sabías que…',120),'');
const a1=mk(`<div class="t" style="font-size:330px;color:${INK};font-weight:900"><span id="pc">0</span> %</div>`,'');
const a2=mk(T('de las ventas del año pueden<br>concentrarse en noviembre<br>y diciembre.',58,INK,500),'');
const a3=mk(T('Fuente: Cámara de Comercio de Guayaquil',30,GREEN,500),'');
track(a0,0,4.4,(d,lt)=>{setHL(d,eo(lt/.35));put(d,0,-560,{s:eb(lt/.45),o:win(lt,4.4,.05,.25)})});
track(a1,1.1,4.4,(d,lt)=>{d.querySelector('#pc').textContent=Math.round(eo(lt/1.3)*22);put(d,0,-130,{s:eb(lt/.5),o:win(lt,3.3,.1,.25)})});
track(a2,2.2,4.4,(d,lt)=>put(d,0,250,{s:eb(lt/.45),o:win(lt,2.2,.1,.25)}));
track(a3,2.9,4.4,(d,lt)=>put(d,0,520,{s:1,o:win(lt,1.5,.2,.25)}));
// ---- B 4.4-8 intro Dani
const dn=mk('', 'top:960px');
const b0=mk(T('Esta es la historia de <span class="hl" style="font-size:inherit;padding:0 16px"><i class="bg"></i><span>Dani</span></span>',62),'');
const b1=mk(T('dueño de una barbería',54,INK,500),'');
track(dn,4.4,39,(d,lt)=>{const t=lt+4.4;let m='happy',x=0,y=130,s=1;
 if(t<8){m='happy';y=130}else if(t<10.7){m='happy';y=190;s=.85}else if(t<14.7){m='stress';y=230;s=.8;x=-140}else if(t<18.7){m='stress';y=250;s=.8}else if(t<23.2){m='sad';y=250;s=.8}else if(t<26){m='sad';y=300;s=.6;x=-320}else if(t<31.6){m='relax';y=700;s=.42;x=340}else if(t<35.6){m='relax';y=170;s=1}else{m='relax';y=-1200;s=.1}
 setMood(d,m);put(d,x,y+bob(lt,9,3.5),{s:s*eb(Math.min(lt,.5)/.5),o:t<35.4?1:Math.max(0,(35.6-t)/.2)})});
track(b0,4.5,8,(d,lt)=>{setHL(d.querySelector('.hl').parentNode.parentNode,1);d.querySelector('.bg').style.transform='scaleX('+eo((lt-.5)/.35)+')';put(d,0,-520,{s:eb(lt/.45),o:win(lt,3.5,.05,.25)})});
track(b1,5.2,8,(d,lt)=>put(d,0,560,{s:eb(lt/.45),o:win(lt,2.8,.1,.25)}));
// ---- C 8-10.7 viernes
const c0=mk(T('Viernes de Black Friday',70),'');const c1=mk(`<div style="background:${LIME};padding:14px 40px;border-radius:60px;font-weight:800;font-size:46px">9:00 am · Promo lista</div>`);
track(c0,8,10.7,(d,lt)=>put(d,0,-540,{s:eb(lt/.45),o:win(lt,2.7,.1,.25)}));
track(c1,8.5,10.7,(d,lt)=>put(d,0,-380,{s:eb(lt/.45),o:win(lt,2.2,.1,.25)}));
// ---- D 10.7-14.7 avalancha
const msgs=['¿Hay cupo hoy?','¿Cuánto cuesta?','¿Hasta qué hora?','¿Me separan uno?','¿Dónde están?','¿Atienden sábado?'];
const mel=msgs.map(m=>mk(`<div style="background:#EDEDEA;padding:18px 32px;border-radius:34px;font-weight:500;font-size:38px;color:${INK}">${m}</div>`));
const badge=mk(`<div id="bn" style="background:${INK};color:${LIME};font-weight:900;font-size:84px;padding:6px 44px;border-radius:70px;text-align:center">0</div>`);
const d0=mk(T('A las 11:00,<br>ya son 80 mensajes.',70),'');
track(d0,10.8,14.7,(d,lt)=>put(d,0,-690,{s:eb(lt/.45),o:win(lt,3.9,.1,.25)}));
mel.forEach((d,i)=>track(d,11.0+i*.4,14.7,(dd,lt)=>{const side=i%2?1:-1;put(dd,side*(250+(i%3)*30),-460+i*95,{s:eb(lt/.35),o:win(lt,14.7-11.0-i*.4,.05,.25)})}));
track(badge,11.1,14.7,(d,lt)=>{d.querySelector('#bn').textContent=Math.round(eo(lt/2.4)*80);put(d,300,-560,{s:eb(lt/.4),o:win(lt,3.6,.1,.25)})});
// ---- E 14.7-18.7 cuenta
const e0=mk(T('Cada mensaje: contestar y agendar.',58,INK,500),'');const e1=mk(T('80 × 3 min',120),'');const e2=mk(HL('= 4 horas',150),'');
track(e0,14.7,18.7,(d,lt)=>put(d,0,-640,{s:eb(lt/.4),o:win(lt,4,.1,.25)}));
track(e1,15.2,18.7,(d,lt)=>put(d,0,-480,{s:eb(lt/.4),o:win(lt,3.5,.1,.25)}));
track(e2,16.0,18.7,(d,lt)=>{setHL(d,eo(lt/.35));put(d,0,-300,{s:eb(lt/.5),o:win(lt,2.7,.1,.25)})});
// ---- F 18.7-23.2 cliente perdido
const f0=mk(T('Alguien escribió:',60,INK,500),'');
const f1=mk(`<div style="background:#EDEDEA;padding:26px 44px;border-radius:44px;font-weight:500;font-size:48px;color:${INK}">¿Hay cupo hoy a las 4?<div style="font-size:28px;margin-top:8px;color:${GREEN};text-align:right">visto · hace 4 horas</div></div>`);
const f2=mk(T('Nadie contestó.<br>Ya había agendado<br>en otro lado.',84),'');
track(f0,18.7,23.2,(d,lt)=>put(d,0,-640,{s:eb(lt/.4),o:win(lt,4.5,.1,.25)}));
track(f1,19.2,23.2,(d,lt)=>put(d,0,-430,{s:eb(lt/.45),o:win(lt,4,.1,.25)}));
track(f2,20.6,23.2,(d,lt)=>put(d,0,-90,{s:eb(lt/.45),o:win(lt,2.6,.1,.25)}));
// ---- G 23.2-26 pregunta
const g0=mk(T('¿Cuánto vale',112),'');const g1=mk(HL('una hora',150),'');const g2=mk(T('de tu día?',112),'');const gclk=mk(clockSVG.replace('width="560" height="560"','width="300" height="300"'));
track(g0,23.2,26,(d,lt)=>put(d,0,-560,{s:eb(lt/.4),o:win(lt,2.8,.1,.25)}));
track(g1,23.5,26,(d,lt)=>{setHL(d,eo(lt/.35));put(d,0,-410,{s:eb(lt/.45),o:win(lt,2.5,.1,.25)})});
track(g2,23.8,26,(d,lt)=>put(d,0,-260,{s:eb(lt/.4),o:win(lt,2.2,.1,.25)}));
track(gclk,23.4,26,(d,lt)=>{const a=eio(lt/2.4)*720;d.querySelector('#mh').setAttribute('transform',`rotate(${a} 200 200)`);d.querySelector('#hh').setAttribute('transform',`rotate(${a/12+270} 200 200)`);put(d,0,-20,{s:eb(lt/.5),o:win(lt,2.6,.1,.25)})});
// ---- H 26-31.6 con Iguana
const h0=mk(T('Con Iguana',72,GREEN,800),'');
const hb1=mk(`<div style="background:#EDEDEA;padding:26px 40px;border-radius:44px;font-weight:500;font-size:44px;max-width:640px;white-space:normal;line-height:1.25;color:${INK}">Hola, ¿tienen cupo mañana a las 4?</div>`);
const hd=mk(`<div style="background:${LIME};padding:22px 40px;border-radius:44px;display:flex;gap:12px">${[0,1,2].map(()=>`<i class="dt" style="width:20px;height:20px;border-radius:50%;background:${INK};display:block"></i>`).join('')}</div>`);
const hb2=mk(`<div style="background:${LIME};padding:26px 40px;border-radius:44px;font-weight:500;font-size:44px;max-width:640px;white-space:normal;line-height:1.25;color:${INK}">¡Hola! Sí, mañana a las 4:00 pm tengo espacio. ¿Te lo agendo?</div>`);
const cal=mk(calSVG.replace('width="420" height="420"','width="360" height="360"'));const h4=mk(HL('Responde y agenda por ti',60),'');
track(h0,26,31.6,(d,lt)=>put(d,0,-700,{s:eb(lt/.4),o:win(lt,5.6,.1,.25)}));
track(hb1,26.3,31.6,(d,lt)=>put(d,-120,-520,{s:eb(lt/.4),o:win(lt,5.3,.1,.25)}));
track(hd,27.1,28.2,(d,lt)=>{d.querySelectorAll('.dt').forEach((e,i)=>e.style.transform=`translateY(${-Math.abs(Math.sin(lt*7+i*.8))*14}px)`);put(d,120,-330,{s:eb(lt/.3),o:win(lt,1.1,.05,.1)})});
track(hb2,28.2,31.6,(d,lt)=>put(d,120,-300,{s:eb(lt/.4),o:win(lt,3.4,.1,.25)}));
track(cal,29.0,31.6,(d,lt)=>{d.querySelector('#ck').style.strokeDashoffset=80*(1-eo((lt-.5)/.4));put(d,0,110,{s:eb(lt/.5),o:win(lt,2.6,.1,.25)})});
track(h4,30.0,31.6,(d,lt)=>{setHL(d,eo(lt/.35));put(d,0,420,{s:eb(lt/.4),o:win(lt,1.6,.1,.25)})});
// ---- I 31.6-35.6 cena
const i0=mk(T('A las 6, Dani cierra<br>y llega a cenar<br>con su familia.',78),'');
const hearts=[0,1,2,3].map(i=>mk(heart.replace(/width="120" height="120"/,'width="110" height="110"').replace(/stroke="#383838"/g,`stroke="${GREEN}" fill="${LIME}"`)));
track(i0,31.7,35.6,(d,lt)=>put(d,0,-560,{s:eb(lt/.45),o:win(lt,3.9,.1,.25)}));
hearts.forEach((d,i)=>track(d,32.4+i*.35,35.6,(dd,lt)=>put(dd,-260+i*170,-60-eo(lt/1.4)*260-Math.sin(lt*3+i)*14,{s:eb(lt/.4)*(.8+i%2*.3),r:Math.sin(lt*2+i)*8,o:win(lt,3.2-i*.35,.1,.3)})));
// ---- J 35.6-39 cierre
const logo=mk(`<img src="assets/logo_green.png" style="width:700px;display:block">`);
const j1=mk(HL('Recupera tus horas.',92),'');
const j2=mk(`<div style="background:${INK};color:${PAPER};padding:24px 48px;border-radius:70px;font-weight:800;font-size:40px">Agenda tu demo gratis · link en la bio</div>`);
track(logo,35.6,39,(d,lt)=>put(d,0,-330,{s:eb(lt/.5),o:clamp(lt/.15)}));
track(j1,36.0,39,(d,lt)=>{setHL(d,eo(lt/.35));put(d,0,-60,{s:eb(lt/.45),o:clamp(lt/.1)})});
track(j2,36.7,39,(d,lt)=>put(d,0,190,{s:eb(lt/.45),o:clamp(lt/.1)}));
window.render=function(t){
 put(handle,0,890);
 bar.firstChild.style.transform=`scaleX(${clamp(t/DUR)})`;
 for(const k of tracks){const on=t>=k.a&&t<k.b;k.d.style.display=on?'block':'none';if(on)k.fn(k.d,t-k.a)}
 return true};
render(0);
</script></body></html>
